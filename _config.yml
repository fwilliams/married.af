title: "Amanda & Francis"
tagline: "Married in Montréal · 2027"
description: "Amanda Zhang and Francis Williams are getting married in Montréal on August 7, 2027."
url: "https://married.af"
author: "Amanda & Francis"
lang: en

# Content settings
markdown: kramdown
kramdown:
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]
  typographic_symbols:
    hellip: "…"
    ndash: "–"
    mdash: "—"

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Wedding config — edit these as details solidify
wedding:
  day_of_week: "Saturday"
  date_long: "The Seventh of August"        # day + month, romantic form
  date_year: "2027"                          # numeric year for inline date-line
  year_long: "Two Thousand Twenty-Seven"     # year spelled out, italic display
  date_short: "August 7, 2027"               # short form for OG/meta
  masthead_sub: "Married · MMXXVII"        # short ornamental sub-mark below the A & F monogram
  location: "Montréal"
  venue: "Crew Collective & Café"            # former Royal Bank of Canada, Old Montréal
  address: "360 Rue Saint-Jacques, Montréal" # fill in if you want full address rendered
  rsvp_deadline: ""                          # fill in when set
  contact_email: "hello@married.af"          # placeholder

# RSVP backend — Withjoy. Fill in the redirect URL after creating the Joy event.
rsvp:
  redirect_url_template: ""                    # e.g. https://withjoy.com/amanda-and-francis/rsvp?guest={code}
  testing: true                                # when true, ?c=TEST surfaces a test banner

# Passphrase gate — generate a hash once passphrase is chosen
gate:
  passphrase_hash: ""                          # SHA-256 hex of the passphrase
  passphrase_version: 1                        # bump to invalidate stored unlocks

# Analytics — fill with GA4 measurement ID once site is live
analytics:
  ga4_id: ""

# Build settings
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - DESIGN_REVIEW.md
  - PALETTE_EXPLORATIONS.md
  - TYPOGRAPHY_AUDIT.md
  - mockups/
  - node_modules/
  - vendor/
  - .vscode/
  - landing.html     # the mockup extract; not part of the real site

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      status: "live"
