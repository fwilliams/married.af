<!-- Add-to-Calendar chooser. Hidden until a trigger (#addToCal / #saveTheDate)
     opens it; option hrefs are populated by addToCalendar() in main.js. -->
<div class="cal-modal" id="cal-modal" role="dialog" aria-modal="true"
     aria-labelledby="cal-modal-title" aria-hidden="true">
  <div class="cal-modal__card">
    <button class="cal-modal__close" id="cal-modal-close" type="button" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <h2 class="cal-modal__title" id="cal-modal-title">Add to Calendar</h2>
    <p class="cal-modal__sub">{{ site.wedding.day_of_week }}, August 7 &middot; {{ site.wedding.location }}</p>
    <ul class="cal-modal__list">
      <li><a class="cal-opt" id="cal-google"    href="#" target="_blank" rel="noopener">Google Calendar</a></li>
      <li><a class="cal-opt" id="cal-apple"      href="#">Apple Calendar</a></li>
      <li><a class="cal-opt" id="cal-outlook"    href="#" target="_blank" rel="noopener">Outlook.com</a></li>
      <li><a class="cal-opt" id="cal-office365"  href="#" target="_blank" rel="noopener">Office&nbsp;365</a></li>
      <li><a class="cal-opt" id="cal-yahoo"      href="#" target="_blank" rel="noopener">Yahoo</a></li>
    </ul>
  </div>
</div>
