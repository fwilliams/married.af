<footer class="footer" role="contentinfo" data-reveal>
  <div class="footer__sig"><em>married.af</em></div>
  <div class="footer__count" id="countdown" data-target="{{ site.wedding.datetime_iso }}" data-duration="{{ site.wedding.duration_hours | default: 10 }}" role="timer" aria-label="Time until the wedding">
    <span class="footer__count-num" data-unit="days">&mdash;</span> Days
    <span class="footer__count-sep" aria-hidden="true">&middot;</span>
    <span class="footer__count-num" data-unit="hours">&mdash;</span> Hours
    <span class="footer__count-sep" aria-hidden="true">&middot;</span>
    <span class="footer__count-num" data-unit="minutes">&mdash;</span> Minutes
    <span class="footer__count-sep" aria-hidden="true">&middot;</span>
    <span class="footer__count-num" data-unit="seconds">&mdash;</span> Seconds
  </div>
  {% if site.wedding.contact_email and site.wedding.contact_email != "" %}
  <div class="footer__contact">Questions? <a href="mailto:{{ site.wedding.contact_email }}">{{ site.wedding.contact_email }}</a></div>
  {% endif %}
  <div class="footer__copyright">© 2027 · {{ site.author }}</div>
</footer>
