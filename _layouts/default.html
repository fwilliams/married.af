<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ site.author }}">

  {%- include seo-meta.html -%}

  <!-- Preconnect to Google Fonts (swap to self-hosted in a later pass) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicons — minimal set for v1; full set in phase 2 -->
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

  <script>document.documentElement.classList.replace('no-js', 'js');</script>

  {%- include analytics.html -%}
</head>
<body>
  {%- include masthead.html -%}

  <main class="page">
    {%- if page.status == "draft" or page.status == "teaser" -%}
      {% include coming-soon.html %}
    {%- else -%}
      {{ content }}
    {%- endif -%}
  </main>

  {%- include footer.html -%}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
